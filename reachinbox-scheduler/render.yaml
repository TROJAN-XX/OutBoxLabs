services:
  # Backend API + Worker
  - type: web
    name: reachinbox-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: reachinbox-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: reachinbox-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: FRONTEND_URL
        value: https://reachinbox-frontend.onrender.com
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: ETHEREAL_HOST
        value: smtp.ethereal.email
      - key: ETHEREAL_PORT
        value: 587
      - key: WORKER_CONCURRENCY
        value: 5
      - key: MAX_EMAILS_PER_HOUR
        value: 100
      - key: MIN_EMAIL_DELAY_MS
        value: 2000

  # Frontend Static Site
  - type: web
    name: reachinbox-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://reachinbox-backend.onrender.com/api
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false

  # Redis / Key-Value Instance
  - type: keyvalue
    name: reachinbox-redis
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: []

databases:
  - name: reachinbox-postgres
    plan: free
    databaseName: reachinbox_db
    user: reachinbox
